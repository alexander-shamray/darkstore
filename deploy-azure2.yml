name: Deploy to Azure App Service

# Пайплайн деплоя:
#   1. build             — сборка + backend unit тесты + frontend unit тесты
#   2. deploy-staging    — авто-деплой в Staging после успешного build
#   3. e2e-staging       — Playwright E2E тесты на Staging (вызывает e2e-staging.yml)
#   4. deploy-production — деплой в Production ТОЛЬКО после ручного подтверждения + E2E pass
#
# Аутентификация в Azure: OIDC (Federated Identity Credential) — без статических секретов.
# Необходимые GitHub Secrets: AZURE_CLIENT_ID, AZURE_TENANT_ID, AZURE_SUBSCRIPTION_ID
# Настройка: см. PROJECT_CREATION_STEPS.md → Шаг 8 (OIDC)
#
# Как настроить ручное подтверждение Production:
#   GitHub → Settings → Environments → "production" → Required reviewers → добавить себя
#
# deploy-azure1.yml — PR check (unit тесты + coverage gate + vuln scan).
# test.yml          — Полный тест пайплайн (unit + integration + frontend).
# e2e-staging.yml   — E2E Playwright тесты (вызывается из этого файла).

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      skip_staging:
        description: 'Пропустить Staging и деплоить сразу в Production (только для hotfix)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'true']

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '22.x'

jobs:
  # ─────────────────────────────────────────
  # JOB 1: Сборка, тесты и публикация артефакта
  # ─────────────────────────────────────────
  build:
    name: 🔨 Build, Test & Publish
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js (для Frontend build)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj', '**/*.slnx') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # ── Backend ──────────────────────────────────────────
      - name: Restore .NET dependencies
        run: dotnet restore

      - name: Check for vulnerable packages
        run: dotnet list package --vulnerable --include-transitive 2>&1 | tee vuln.txt; grep -q "has the following vulnerable packages" vuln.txt && exit 1 || exit 0

      - name: Check comments language (English only)
        run: |
          npx cspell lint \
            --config .cspell.json \
            --no-progress \
            --show-suggestions \
            "src/**/*.cs" "tests/**/*.cs"
        # Fails if non-English words are found in source files.
        # Add project-specific terms to .cspell.json → "words" array.

      - name: Build backend
        run: dotnet build src/DarkStore.API/DarkStore.API.csproj --configuration Release --no-restore

      - name: Run Backend Unit Tests
        run: |
          dotnet test tests/DarkStore.UnitTests/DarkStore.UnitTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "github" \
            --logger "trx;LogFileName=unit-results.trx" \
            --results-directory ./coverage/unit

      - name: Run Architecture Tests
        run: |
          dotnet test tests/DarkStore.ArchitectureTests/DarkStore.ArchitectureTests.csproj \
            --configuration Release \
            --no-build \
            --verbosity normal \
            --logger "github" \
            --results-directory ./coverage/architecture

      - name: Publish backend
        run: dotnet publish src/DarkStore.API/DarkStore.API.csproj -c Release -o ./publish --no-build

      # ── Frontend ──────────────────────────────────────────
      - name: Install Frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: npm audit (high + critical CVEs fail build)
        working-directory: frontend
        run: npm audit --audit-level=high

      - name: Run Frontend Unit Tests (Jest)
        working-directory: frontend
        run: npm run test -- --ci --coverage --coverageReporters=text-summary
        continue-on-error: false

      - name: Build Angular (production)
        working-directory: frontend
        run: npm run build -- --configuration production --output-path ../publish/wwwroot

      # ── Артефакт ──────────────────────────────────────────
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-publish-${{ github.sha }}
          path: ./publish
          retention-days: 30

  # ─────────────────────────────────────────
  # JOB 2: Деплой в Staging (авто)
  # ─────────────────────────────────────────
  deploy-staging:
    name: 🚀 Deploy → Staging
    runs-on: ubuntu-latest
    needs: build
    if: github.event.inputs.skip_staging != 'true'
    environment:
      name: staging
      url: https://${{ secrets.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net

    # Обязательно для OIDC — разрешить запрос токена
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish-${{ github.sha }}
          path: ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Staging
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME_STAGING }}
          package: ./publish

      - name: Azure Logout
        if: always()
        run: az logout

      - name: Health check — Staging
        run: |
          echo "Ожидание запуска приложения..."
          sleep 20
          curl -f https://${{ secrets.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net/health || exit 1
          echo "✅ Staging health check пройден"

      - name: Notify Telegram — Staging deployed
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            🟡 **Dark Store — Staging задеплоен**

            📌 Окружение: Staging
            🌐 Ссылка: https://${{ secrets.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net
            👤 Автор: ${{ github.actor }}
            📝 Коммит: ${{ github.event.head_commit.message }}
            🔗 SHA: ${{ github.sha }}

            🎭 *Запускаются E2E тесты на Staging...*
            ---
            *Dark Store CI/CD*

  # ─────────────────────────────────────────
  # JOB 3: E2E тесты на Staging (Playwright)
  # Блокирует деплой в Production при провале
  # ─────────────────────────────────────────
  e2e-staging:
    name: 🎭 E2E Tests — Staging
    needs: deploy-staging
    uses: ./.github/workflows/e2e-staging.yml
    with:
      staging_url: https://${{ secrets.AZURE_WEBAPP_NAME_STAGING }}.azurewebsites.net
    secrets:
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}

  # ─────────────────────────────────────────
  # JOB 4: Деплой в Production (ручное подтверждение)
  # Требует: deploy-staging SUCCESS + e2e-staging SUCCESS
  # ─────────────────────────────────────────
  deploy-production:
    name: 🏁 Deploy → Production
    runs-on: ubuntu-latest
    needs: [ deploy-staging, e2e-staging ]
    if: always() && (
      (needs.deploy-staging.result == 'success' && needs.e2e-staging.result == 'success') ||
      github.event.inputs.skip_staging == 'true'
    )
    environment:
      name: production
      url: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net

    # Обязательно для OIDC — разрешить запрос токена
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: app-publish-${{ github.sha }}
          path: ./publish

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Production
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
          package: ./publish

      - name: Azure Logout
        if: always()
        run: az logout

      - name: Health check — Production
        run: |
          echo "Ожидание запуска приложения..."
          sleep 20
          curl -f https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net/health || exit 1
          echo "✅ Production health check пройден"

      - name: Notify Telegram — Production deployed
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ✅ **Dark Store — Production задеплоен успешно!**

            📌 Окружение: Production
            🌐 Ссылка: https://${{ secrets.AZURE_WEBAPP_NAME }}.azurewebsites.net
            ⏰ Время: ${{ github.event.head_commit.timestamp }}
            👤 Автор: ${{ github.actor }}
            📝 Коммит: ${{ github.event.head_commit.message }}
            🔗 SHA: ${{ github.sha }}

            ---
            *Dark Store CI/CD*

      - name: Notify Telegram — Production FAILED
        if: failure()
        uses: appleboy/telegram-action@v1.0.0
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message: |
            ❌ **Dark Store — ОШИБКА деплоя в Production!**

            👤 Автор: ${{ github.actor }}
            📝 Коммит: ${{ github.event.head_commit.message }}
            🔗 SHA: ${{ github.sha }}
            🔍 Логи: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

            ---
            *Dark Store CI/CD*
